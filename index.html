<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vale do Morango - Fazenda & Mercado</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2137;
            color: #fff6d3;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #hud {
            background: #5a3b29;
            border: 4px solid #e0a96d;
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 10px;
            display: flex;
            gap: 25px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 0 #3a2316;
        }
        .hud-item span { color: #ffd700; }
        canvas {
            border: 6px solid #e0a96d;
            border-radius: 8px;
            background-color: #7ec850;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #controles {
            margin-top: 10px;
            background: #3d291d;
            padding: 8px 16px;
            border-radius: 6px;
            border: 2px solid #a67c52;
            font-size: 14px;
            color: #ffefc1;
            text-align: center;
        }
        kbd {
            background: #e0a96d;
            color: #2c2137;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">🪙 Ouro: <span id="ui-ouro">50</span>g</div>
        <div class="hud-item">🌱 Sementes: <span id="ui-sementes">3</span></div>
        <div class="hud-item">🍓 Na Mochila: <span id="ui-morangos">0</span></div>
        <div class="hud-item">🛒 Na Prateleira: <span id="ui-estoque">0</span></div>
    </div>

    <!-- Aumentei o canvas para caber a fazenda e a cidade lado a lado bonitinhas -->
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="controles">
        Andar: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> ou <kbd>Setas</kbd> | 
        Interagir (Plantar, Colher, Abastecer, Caixa): <kbd>Espaço</kbd> ou <kbd>E</kbd>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Carregando o seu tileset oficial do Cloudinary
const tilesetImg = new Image();
tilesetImg.src = "https://res.cloudinary.com/oactqmgs/image/upload/v1793927465/tilemap_packed.png";

// --- ESTADO DO JOGO ---
const jogo = {
    ouro: 50,
    sementes: 3,
    morangosMochila: 0,
    estoquePrateleira: 0,
    mensagem: "Colha morangos na fazenda à esquerda e venda no mercado da cidade!",
    tempoMensagem: 180
};

// --- JOGADOR ---
const player = {
    x: 180,
    y: 270,
    w: 36,
    h: 36,
    vel: 3.5
};

// --- ÁRVORES DA FAZENDA ---
const arvoresFazenda = [
    { x: 30, y: 30 }, { x: 100, y: 30 }, { x: 30, y: 450 }, { x: 100, y: 460 }
];

// --- FAZENDA: CANTEIROS ---
const canteiros = [];
for (let linha = 0; linha < 3; linha++) {
    for (let col = 0; col < 3; col++) {
        canteiros.push({
            x: 150 + col * 65,
            y: 190 + linha * 65,
            w: 52,
            h: 52,
            estado: 0,
            progresso: 0
        });
    }
}

// --- ESTAÇÕES DE INTERAÇÃO ---
const lojaSementes = { x: 170, y: 70, w: 120, h: 50, preco: 10 };
const gondolaMercado = { x: 670, y: 160, w: 130, h: 60 };
const caixaRegistradora = { x: 630, y: 360, w: 90, h: 55 };

// --- CLIENTES DA CIDADE ---
const clientes = [];
let timerNovoCliente = 120;

function criarCliente() {
    if (clientes.length >= 4) return;
    clientes.push({
        x: 900,
        y: 470,
        w: 32,
        h: 32,
        vel: 1.8,
        estado: 'INDO_PRATELEIRA'
    });
}

// --- CONTROLES ---
const teclas = {};
window.addEventListener('keydown', (e) => {
    teclas[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.key.toLowerCase() === 'e') {
        interagir();
    }
});
window.addEventListener('keyup', (e) => {
    teclas[e.key.toLowerCase()] = false;
});

function mostrarAviso(texto) {
    jogo.mensagem = texto;
    jogo.tempoMensagem = 150;
}

function atualizarHUD() {
    document.getElementById('ui-ouro').innerText = jogo.ouro;
    document.getElementById('ui-sementes').innerText = jogo.sementes;
    document.getElementById('ui-morangos').innerText = jogo.morangosMochila;
    document.getElementById('ui-estoque').innerText = jogo.estoquePrateleira;
}

function distancia(a, b) {
    const cxA = a.x + (a.w || 0) / 2;
    const cyA = a.y + (a.h || 0) / 2;
    const cxB = b.x + (b.w || 0) / 2;
    const cyB = b.y + (b.h || 0) / 2;
    return Math.hypot(cxA - cxB, cyA - cyB);
}

function interagir() {
    for (let c of canteiros) {
        if (distancia(player, c) < 60) {
            if (c.estado === 0) {
                if (jogo.sementes > 0) {
                    jogo.sementes--;
                    c.estado = 1;
                    c.progresso = 0;
                    mostrarAviso("🌱 Semente de morango plantada!");
                    atualizarHUD();
                } else {
                    mostrarAviso("❌ Sem sementes! Compre na lojinha (10g).");
                }
                return;
            } else if (c.estado === 3) {
                c.estado = 0;
                c.progresso = 0;
                jogo.morangosMochila += 2;
                mostrarAviso("🍓 Você colheu 2 Morangos!");
                atualizarHUD();
                return;
            } else {
                mostrarAviso("⏳ A plantinha ainda está crescendo...");
                return;
            }
        }
    }

    if (distancia(player, lojaSementes) < 80) {
        if (jogo.ouro >= lojaSementes.preco) {
            jogo.ouro -= lojaSementes.preco;
            jogo.sementes += 3;
            mostrarAviso("🛍️ Comprou 3 Sementes por 10 ouros!");
            atualizarHUD();
        } else {
            mostrarAviso("❌ Ouro insuficiente (Precisa de 10g).");
        }
        return;
    }

    if (distancia(player, gondolaMercado) < 90) {
        if (jogo.morangosMochila > 0) {
            jogo.estoquePrateleira += jogo.morangosMochila;
            mostrarAviso(`🛒 Abasteceu a prateleira com ${jogo.morangosMochila} morangos!`);
            jogo.morangosMochila = 0;
            atualizarHUD();
        } else {
            mostrarAviso("❌ Sem morangos na mochila para expor!");
        }
        return;
    }

    if (distancia(player, caixaRegistradora) < 90) {
        const clienteFila = clientes.find(cli => cli.estado === 'NA_FILA');
        if (clienteFila) {
            clienteFila.estado = 'SAINDO';
            jogo.ouro += 15;
            mostrarAviso("💰 Venda realizada no Caixa! +15 Ouros!");
            atualizarHUD();
        } else {
            mostrarAviso("🔔 Nenhum cliente esperando no caixa agora.");
        }
        return;
    }
}

function atualizar() {
    let dx = 0, dy = 0;
    if (teclas['w'] || teclas['arrowup']) dy = -player.vel;
    if (teclas['s'] || teclas['arrowdown']) dy = player.vel;
    if (teclas['a'] || teclas['arrowleft']) dx = -player.vel;
    if (teclas['d'] || teclas['arrowright']) dx = player.vel;

    let novoX = player.x + dx;
    let novoY = player.y + dy;

    // Passagem da fazenda para a cidade
    const naPorta = (novoY > 210 && novoY + player.h < 330);
    if (!naPorta && novoX + player.w > 480 && novoX < 500) {
        novoX = player.x;
    }

    player.x = Math.max(10, Math.min(canvas.width - player.w - 10, novoX));
    player.y = Math.max(10, Math.min(canvas.height - player.h - 10, novoY));

    for (let c of canteiros) {
        if (c.estado === 1 || c.estado === 2) {
            c.progresso += 1;
            if (c.progresso > 180) c.estado = 2;
            if (c.progresso > 360) c.estado = 3;
        }
    }

    timerNovoCliente--;
    if (timerNovoCliente <= 0) {
        criarCliente();
        timerNovoCliente = 240;
    }

    let indiceFila = 0;
    for (let i = clientes.length - 1; i >= 0; i--) {
        let cli = clientes[i];

        if (cli.estado === 'INDO_PRATELEIRA') {
            moverPara(cli, gondolaMercado.x + 40, gondolaMercado.y + 70);
            if (Math.hypot(cli.x - (gondolaMercado.x + 40), cli.y - (gondolaMercado.y + 70)) < 12) {
                cli.estado = 'ESPERANDO_ESTOQUE';
            }
        } 
        else if (cli.estado === 'ESPERANDO_ESTOQUE') {
            if (jogo.estoquePrateleira > 0) {
                jogo.estoquePrateleira--;
                cli.estado = 'INDO_CAIXA';
                atualizarHUD();
            }
        } 
        else if (cli.estado === 'INDO_CAIXA' || cli.estado === 'NA_FILA') {
            const posFilaX = caixaRegistradora.x + 90 + (indiceFila * 36);
            const posFilaY = caixaRegistradora.y + 12;
            indiceFila++;
            moverPara(cli, posFilaX, posFilaY);
            if (Math.hypot(cli.x - posFilaX, cli.y - posFilaY) < 8) {
                cli.estado = 'NA_FILA';
            }
        } 
        else if (cli.estado === 'SAINDO') {
            moverPara(cli, 920, 470);
            if (cli.x > 910) {
                clientes.splice(i, 1);
            }
        }
    }

    if (jogo.tempoMensagem > 0) jogo.tempoMensagem--;
}

function moverPara(entidade, destX, destY) {
    const angulo = Math.atan2(destY - entidade.y, destX - entidade.x);
    if (Math.hypot(destX - entidade.x, destY - entidade.y) > entidade.vel) {
        entidade.x += Math.cos(angulo) * entidade.vel;
        entidade.y += Math.sin(angulo) * entidade.vel;
    }
}

function desenhar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (tilesetImg.complete && tilesetImg.naturalWidth !== 0) {
        // --- LADO ESQUERDO: FAZENDA (Grama verde do tileset) ---
        ctx.drawImage(tilesetImg, 144, 0, 48, 48, 0, 0, 500, canvas.height);

        // --- LADO DIREITO: CIDADE / MERCADO (Ruas e prédios do Tiny City) ---
        // Asfalto da rua da cidade
        ctx.drawImage(tilesetImg, 48, 64, 96, 48, 500, 200, 460, 140);
        // Prédios / calçadas superiores e inferiores
        ctx.drawImage(tilesetImg, 0, 0, 96, 64, 500, 0, 460, 200);
        ctx.drawImage(tilesetImg, 0, 64, 48, 64, 500, 340, 460, 200);
    } else {
        ctx.fillStyle = '#7ec850';
        ctx.fillRect(0, 0, 500, canvas.height);
        ctx.fillStyle = '#4a6fa5';
        ctx.fillRect(500, 0, canvas.width - 500, canvas.height);
    }

    // Caminho de terra conectando a fazenda à cidade
    ctx.fillStyle = '#d4a373';
    ctx.fillRect(450, 220, 80, 100);

    // Loja de Sementes
    ctx.fillStyle = '#5c4033';
    ctx.fillRect(lojaSementes.x, lojaSementes.y, lojaSementes.w, lojaSementes.h);
    ctx.fillStyle = '#e76f51';
    ctx.fillRect(lojaSementes.x - 6, lojaSementes.y - 14, lojaSementes.w + 12, 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText("🌱 SEMENTES (10g)", lojaSementes.x + 4, lojaSementes.y + 30);

    // Canteiros de Plantação
    for (let c of canteiros) {
        ctx.fillStyle = '#582f0e';
        ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.strokeStyle = '#3b1f07';
        ctx.lineWidth = 2;
        ctx.strokeRect(c.x, c.y, c.w, c.h);

        if (c.estado === 1) {
            ctx.fillStyle = '#99d98c';
            ctx.fillRect(c.x + 20, c.y + 20, 12, 12);
        } else if (c.estado === 2) {
            ctx.fillStyle = '#52b788';
            ctx.beginPath();
            ctx.arc(c.x + 26, c.y + 26, 12, 0, Math.PI * 2);
            ctx.fill();
        } else if (c.estado === 3) {
            ctx.fillStyle = '#2d6a4f';
            ctx.beginPath();
            ctx.arc(c.x + 26, c.y + 22, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e63946'; // Morangos maduros
            ctx.beginPath();
            ctx.arc(c.x + 20, c.y + 30, 7, 0, Math.PI * 2);
            ctx.arc(c.x + 32, c.y + 28, 7, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Prateleira/Gôndola do Mercado
    ctx.fillStyle = '#6f4e37';
    ctx.fillRect(gondolaMercado.x, gondolaMercado.y, gondolaMercado.w, gondolaMercado.h);
    ctx.fillStyle = '#a68a64';
    ctx.fillRect(gondolaMercado.x + 8, gondolaMercado.y + 8, gondolaMercado.w - 16, gondolaMercado.h - 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(`GÔNDOLA (${jogo.estoquePrateleira})`, gondolaMercado.x + 10, gondolaMercado.y - 8);

    const qtdVisual = Math.min(jogo.estoquePrateleira, 10);
    for (let i = 0; i < qtdVisual; i++) {
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(gondolaMercado.x + 20 + (i % 5) * 20, gondolaMercado.y + 24 + Math.floor(i / 5) * 20, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    // Caixa Registradora
    ctx.fillStyle = '#3a5a40';
    ctx.fillRect(caixaRegistradora.x, caixaRegistradora.y, caixaRegistradora.w, caixaRegistradora.h);
    ctx.fillStyle = '#ffb703';
    ctx.fillRect(caixaRegistradora.x + 35, caixaRegistradora.y + 12, 28, 28);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText("CAIXA", caixaRegistradora.x + 22, caixaRegistradora.y - 8);

    // Clientes
    for (let cli of clientes) {
        if (tilesetImg.complete && tilesetImg.naturalWidth !== 0) {
            ctx.drawImage(tilesetImg, 0, 144, 16, 16, cli.x, cli.y, cli.w, cli.h);
        } else {
            ctx.fillStyle = '#4ea8de';
            ctx.fillRect(cli.x, cli.y, cli.w, cli.h);
        }

        ctx.font = '14px monospace';
        ctx.fillStyle = '#fff6d3';
        if (cli.estado === 'ESPERANDO_ESTOQUE') {
            ctx.fillText("💭🍓?", cli.x - 4, cli.y - 8);
        } else if (cli.estado === 'NA_FILA') {
            ctx.fillText("🪙Pagar!", cli.x - 12, cli.y - 8);
        } else if (cli.estado === 'SAINDO') {
            ctx.fillText("❤️", cli.x + 8, cli.y - 8);
        }
    }

    // Jogador (Personagem cortado diretamente do seu tileset)
    if (tilesetImg.complete && tilesetImg.naturalWidth !== 0) {
        ctx.drawImage(tilesetImg, 16, 160, 16, 16, player.x, player.y, player.w, player.h);
    } else {
        ctx.fillStyle = '#f72585';
        ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    // Árvores da Fazenda (Cortadas do tileset)
    for (let arv of arvoresFazenda) {
        if (tilesetImg.complete && tilesetImg.naturalWidth !== 0) {
            ctx.drawImage(tilesetImg, 96, 64, 16, 32, arv.x, arv.y, 40, 70);
        } else {
            ctx.fillStyle = '#2d6a4f';
            ctx.beginPath();
            ctx.arc(arv.x + 20, arv.y + 20, 20, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Barra de Mensagem
    if (jogo.tempoMensagem > 0) {
        ctx.fillStyle = 'rgba(44, 33, 55, 0.92)';
        ctx.fillRect(180, 485, 600, 42);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.strokeRect(180, 485, 600, 42);
        ctx.fillStyle = '#fff6d3';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(jogo.mensagem, canvas.width / 2, 511);
        ctx.textAlign = 'left';
    }
}

function loop() {
    atualizar();
    desenhar();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
