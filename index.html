<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vale do Morango - Fazenda & Mercado</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1121;
            color: #fff6d3;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #hud {
            background: #4a2e1b;
            border: 4px solid #d49c61;
            border-radius: 8px;
            padding: 8px 18px;
            margin-bottom: 10px;
            display: flex;
            gap: 25px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 0 #2a190f;
        }
        .hud-item span { color: #ffd700; }
        canvas {
            border: 5px solid #d49c61;
            border-radius: 6px;
            background-color: #59b242;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #controles {
            margin-top: 10px;
            background: #2a190f;
            padding: 8px 16px;
            border-radius: 6px;
            border: 2px solid #8c6239;
            font-size: 13px;
            color: #ffefc1;
            text-align: center;
        }
        kbd {
            background: #d49c61;
            color: #1a1121;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">🪙 Ouro: <span id="ui-ouro">50</span>g</div>
        <div class="hud-item">🌱 Sementes: <span id="ui-sementes">3</span></div>
        <div class="hud-item">🍓 Na Mochila: <span id="ui-morangos">0</span></div>
        <div class="hud-item">🛒 Na Prateleira: <span id="ui-estoque">0</span></div>
    </div>

    <canvas id="gameCanvas" width="880" height="480"></canvas>

    <div id="controles">
        Andar: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> ou <kbd>Setas</kbd> | 
        Interagir (Plantar, Colher, Abastecer, Caixa): <kbd>Espaço</kbd> ou <kbd>E</kbd>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Carregando o teu tileset oficial do Cloudinary
const tilesetImg = new Image();
tilesetImg.src = "https://res.cloudinary.com/oactqmgs/image/upload/v1793927465/tilemap_packed.png";

// --- ESTADO DO JOGO ---
const jogo = {
    ouro: 50,
    sementes: 3,
    morangosMochila: 0,
    estoquePrateleira: 0,
    mensagem: "Colha morangos na fazenda à esquerda e leve para vender no seu Mercado!",
    tempoMensagem: 180
};

// --- JOGADOR ---
const player = {
    x: 180,
    y: 240,
    w: 32,
    h: 32,
    vel: 3.5
};

// --- ÁRVORES DECORATIVAS ---
const arvores = [
    { x: 25, y: 25 }, { x: 80, y: 25 }, { x: 25, y: 400 }, { x: 370, y: 25 }
];

// --- FAZENDA: CANTEIROS ---
const canteiros = [];
for (let linha = 0; linha < 3; linha++) {
    for (let col = 0; col < 3; col++) {
        canteiros.push({
            x: 130 + col * 55,
            y: 150 + linha * 55,
            w: 44,
            h: 44,
            estado: 0,
            progresso: 0
        });
    }
}

// --- ESTAÇÕES DE INTERAÇÃO ---
const lojaSementes = { x: 150, y: 55, w: 110, h: 42, preco: 10 };
const gondolaMercado = { x: 620, y: 130, w: 120, h: 50 };
const caixaRegistradora = { x: 590, y: 330, w: 85, h: 50 };

// --- CLIENTES DO MERCADO ---
const clientes = [];
let timerNovoCliente = 120;

function criarCliente() {
    if (clientes.length >= 4) return;
    clientes.push({
        x: 830,
        y: 420,
        w: 28,
        h: 28,
        vel: 1.8,
        estado: 'INDO_PRATELEIRA'
    });
}

// --- CONTROLES ---
const teclas = {};
window.addEventListener('keydown', (e) => {
    teclas[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.key.toLowerCase() === 'e') {
        interagir();
    }
});
window.addEventListener('keyup', (e) => {
    teclas[e.key.toLowerCase()] = false;
});

function mostrarAviso(texto) {
    jogo.mensagem = texto;
    jogo.tempoMensagem = 150;
}

function atualizarHUD() {
    document.getElementById('ui-ouro').innerText = jogo.ouro;
    document.getElementById('ui-sementes').innerText = jogo.sementes;
    document.getElementById('ui-morangos').innerText = jogo.morangosMochila;
    document.getElementById('ui-estoque').innerText = jogo.estoquePrateleira;
}

function distancia(a, b) {
    const cxA = a.x + (a.w || 0) / 2;
    const cyA = a.y + (a.h || 0) / 2;
    const cxB = b.x + (b.w || 0) / 2;
    const cyB = b.y + (b.h || 0) / 2;
    return Math.hypot(cxA - cxB, cyA - cyB);
}

function interagir() {
    for (let c of canteiros) {
        if (distancia(player, c) < 55) {
            if (c.estado === 0) {
                if (jogo.sementes > 0) {
                    jogo.sementes--;
                    c.estado = 1;
                    c.progresso = 0;
                    mostrarAviso("🌱 Semente de morango plantada!");
                    atualizarHUD();
                } else {
                    mostrarAviso("❌ Sem sementes! Compre na lojinha (10g).");
                }
                return;
            } else if (c.estado === 3) {
                c.estado = 0;
                c.progresso = 0;
                jogo.morangosMochila += 2;
                mostrarAviso("🍓 Você colheu 2 Morangos!");
                atualizarHUD();
                return;
            } else {
                mostrarAviso("⏳ A plantinha ainda está a crescer...");
                return;
            }
        }
    }

    if (distancia(player, lojaSementes) < 70) {
        if (jogo.ouro >= lojaSementes.preco) {
            jogo.ouro -= lojaSementes.preco;
            jogo.sementes += 3;
            mostrarAviso("🛍️ Comprou 3 Sementes por 10 ouros!");
            atualizarHUD();
        } else {
            mostrarAviso("❌ Ouro insuficiente (Precisa de 10g).");
        }
        return;
    }

    if (distancia(player, gondolaMercado) < 80) {
        if (jogo.morangosMochila > 0) {
            jogo.estoquePrateleira += jogo.morangosMochila;
            mostrarAviso(`🛒 Abasteceu a prateleira com ${jogo.morangosMochila} morangos!`);
            jogo.morangosMochila = 0;
            atualizarHUD();
        } else {
            mostrarAviso("❌ Sem morangos na mochila para expor!");
        }
        return;
    }

    if (distancia(player, caixaRegistradora) < 80) {
        const clienteFila = clientes.find(cli => cli.estado === 'NA_FILA');
        if (clienteFila) {
            clienteFila.estado = 'SAINDO';
            jogo.ouro += 15;
            mostrarAviso("💰 Venda realizada no Caixa! +15 Ouros!");
            atualizarHUD();
        } else {
            mostrarAviso("🔔 Nenhum cliente à espera no caixa agora.");
        }
        return;
    }
}

function atualizar() {
    let dx = 0, dy = 0;
    if (teclas['w'] || teclas['arrowup']) dy = -player.vel;
    if (teclas['s'] || teclas['arrowdown']) dy = player.vel;
    if (teclas['a'] || teclas['arrowleft']) dx = -player.vel;
    if (teclas['d'] || teclas['arrowright']) dx = player.vel;

    let novoX = player.x + dx;
    let novoY = player.y + dy;

    // Porta entre a fazenda e o mercado
    const naPorta = (novoY > 190 && novoY + player.h < 290);
    if (!naPorta && novoX + player.w > 430 && novoX < 450) {
        novoX = player.x;
    }

    player.x = Math.max(10, Math.min(canvas.width - player.w - 10, novoX));
    player.y = Math.max(10, Math.min(canvas.height - player.h - 10, novoY));

    for (let c of canteiros) {
        if (c.estado === 1 || c.estado === 2) {
            c.progresso += 1;
            if (c.progresso > 180) c.estado = 2;
            if (c.progresso > 360) c.estado = 3;
        }
    }

    timerNovoCliente--;
    if (timerNovoCliente <= 0) {
        criarCliente();
        timerNovoCliente = 240;
    }

    let indiceFila = 0;
    for (let i = clientes.length - 1; i >= 0; i--) {
        let cli = clientes[i];

        if (cli.estado === 'INDO_PRATELEIRA') {
            moverPara(cli, gondolaMercado.x + 35, gondolaMercado.y + 60);
            if (Math.hypot(cli.x - (gondolaMercado.x + 35), cli.y - (gondolaMercado.y + 60)) < 12) {
                cli.estado = 'ESPERANDO_ESTOQUE';
            }
        } 
        else if (cli.estado === 'ESPERANDO_ESTOQUE') {
            if (jogo.estoquePrateleira > 0) {
                jogo.estoquePrateleira--;
                cli.estado = 'INDO_CAIXA';
                atualizarHUD();
            }
        } 
        else if (cli.estado === 'INDO_CAIXA' || cli.estado === 'NA_FILA') {
            const posFilaX = caixaRegistradora.x + 80 + (indiceFila * 32);
            const posFilaY = caixaRegistradora.y + 10;
            indiceFila++;
            moverPara(cli, posFilaX, posFilaY);
            if (Math.hypot(cli.x - posFilaX, cli.y - posFilaY) < 8) {
                cli.estado = 'NA_FILA';
            }
        } 
        else if (cli.estado === 'SAINDO') {
            moverPara(cli, 850, 420);
            if (cli.x > 840) {
                clientes.splice(i, 1);
            }
        }
    }

    if (jogo.tempoMensagem > 0) jogo.tempoMensagem--;
}

function moverPara(entidade, destX, destY) {
    const angulo = Math.atan2(destY - entidade.y, destX - entidade.x);
    if (Math.hypot(destX - entidade.y, destY - entidade.y) > entidade.vel) {
        entidade.x += Math.cos(angulo) * entidade.vel;
        entidade.y += Math.sin(angulo) * entidade.vel;
    }
}

function desenhar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- LADO ESQUERDO: FAZENDA (Fundo verde limpo) ---
    ctx.fillStyle = '#6ab04c';
    ctx.fillRect(0, 0, 440, canvas.height);

    // --- LADO DIREITO: MERCADO (Piso interno amadeirado/claro) ---
    ctx.fillStyle = '#d2a679';
    ctx.fillRect(440, 0, canvas.width - 440, canvas.height);

    // Detalhe de divisória do mercado (parede divisória central)
    ctx.fillStyle = '#4a2e1b';
    ctx.fillRect(435, 0, 10, 190);
    ctx.fillRect(435, 290, 10, 190);

    // Passagem/Porta
    ctx.fillStyle = '#c89d7c';
    ctx.fillRect(435, 190, 10, 100);

    // Loja de Sementes
    ctx.fillStyle = '#5c4033';
    ctx.fillRect(lojaSementes.x, lojaSementes.y, lojaSementes.w, lojaSementes.h);
    ctx.fillStyle = '#e06d53';
    ctx.fillRect(lojaSementes.x - 5, lojaSementes.y - 12, lojaSementes.w + 10, 14);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText("🌱 SEMENTES (10g)", lojaSementes.x + 4, lojaSementes.y + 26);

    // Canteiros de Plantação
    for (let c of canteiros) {
        ctx.fillStyle = '#4a2511';
        ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.strokeStyle = '#2b1408';
        ctx.lineWidth = 2;
        ctx.strokeRect(c.x, c.y, c.w, c.h);

        if (c.estado === 1) {
            ctx.fillStyle = '#99d98c';
            ctx.fillRect(c.x + 16, c.y + 16, 12, 12);
        } else if (c.estado === 2) {
            ctx.fillStyle = '#52b788';
            ctx.beginPath();
            ctx.arc(c.x + 22, c.y + 22, 10, 0, Math.PI * 2);
            ctx.fill();
        } else if (c.estado === 3) {
            ctx.fillStyle = '#2d6a4f';
            ctx.beginPath();
            ctx.arc(c.x + 22, c.y + 18, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e63946'; // Morangos
            ctx.beginPath();
            ctx.arc(c.x + 17, c.y + 25, 5, 0, Math.PI * 2);
            ctx.arc(c.x + 27, c.y + 24, 5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Gôndola do Mercado
    ctx.fillStyle = '#5c4033';
    ctx.fillRect(gondolaMercado.x, gondolaMercado.y, gondolaMercado.w, gondolaMercado.h);
    ctx.fillStyle = '#8c6239';
    ctx.fillRect(gondolaMercado.x + 6, gondolaMercado.y + 6, gondolaMercado.w - 12, gondolaMercado.h - 12);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`GÔNDOLA (${jogo.estoquePrateleira})`, gondolaMercado.x + 10, gondolaMercado.y - 6);

    const qtdVisual = Math.min(jogo.estoquePrateleira, 10);
    for (let i = 0; i < qtdVisual; i++) {
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(gondolaMercado.x + 16 + (i % 5) * 20, gondolaMercado.y + 20 + Math.floor(i / 5) * 16, 5, 0, Math.PI * 2);
        ctx.fill();
    }

    // Caixa Registradora
    ctx.fillStyle = '#3a5a40';
    ctx.fillRect(caixaRegistradora.x, caixaRegistradora.y, caixaRegistradora.w, caixaRegistradora.h);
    ctx.fillStyle = '#ffb703';
    ctx.fillRect(caixaRegistradora.x + 30, caixaRegistradora.y + 10, 24, 24);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText("CAIXA", caixaRegistradora.x + 22, caixaRegistradora.y - 6);

    // Clientes
    for (let cli of clientes) {
        if (tilesetImg.complete && tilesetImg.naturalWidth !== 0) {
            ctx.drawImage(tilesetImg, 0, 144, 16, 16, cli.x, cli.y, cli.w, cli.h);
        } else {
            ctx.fillStyle = '#4ea8de';
            ctx.fillRect(cli.x, cli.y, cli.w, cli.h);
        }

        ctx.font = '13px monospace';
        ctx.fillStyle = '#fff6d3';
        if (cli.estado === 'ESPERANDO_ESTOQUE') {
            ctx.fillText("💭🍓?", cli.x - 4, cli.y - 6);
        } else if (cli.estado === 'NA_FILA') {
            ctx.fillText("🪙Pagar!", cli.x - 10, cli.y - 6);
        } else if (cli.estado === 'SAINDO') {
            ctx.fillText("❤️", cli.x + 6, cli.y - 6);
        }
    }

    // Jogador (Personagem cortado do tileset)
    if (tilesetImg.complete && tilesetImg.naturalWidth !== 0) {
        ctx.drawImage(tilesetImg, 16, 160, 16, 16, player.x, player.y, player.w, player.h);
    } else {
        ctx.fillStyle = '#f72585';
        ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    // Árvores da Fazenda (Cortadas do tileset oficial)
    for (let arv of arvores) {
        if (tilesetImg.complete && tilesetImg.naturalWidth !== 0) {
            ctx.drawImage(tilesetImg, 96, 64, 16, 32, arv.x, arv.y, 36, 64);
        } else {
            ctx.fillStyle = '#2d6a4f';
            ctx.beginPath();
            ctx.arc(arv.x + 18, arv.y + 18, 18, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Barra de Mensagem
    if (jogo.tempoMensagem > 0) {
        ctx.fillStyle = 'rgba(26, 17, 33, 0.95)';
        ctx.fillRect(140, 430, 600, 38);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.strokeRect(140, 430, 600, 38);
        ctx.fillStyle = '#fff6d3';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(jogo.mensagem, canvas.width / 2, 454);
        ctx.textAlign = 'left';
    }
}

function loop() {
    atualizar();
    desenhar();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
